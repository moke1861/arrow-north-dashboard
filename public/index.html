<title>箭牌卫浴 - 数据宝（北部战区）</title>
<style>
:root{
  --brand:#1565C0;--brand-dark:#0D47A1;--brand-light:#E3F2FD;--brand-grad:linear-gradient(135deg,#42A5F5 0%,#1565C0 100%);
  --bg:#F0F6FC;--card:#FFFFFF;--border:#BBDEFB;--border-2:#E1F0FA;
  --text:#0D2638;--text-2:#455A64;--text-3:#78909C;--text-4:#B0BEC5;
  --green:#00897B;--green-bg:#E0F2F1;--green-light:#B2DFDB;
  --red:#E53935;--red-bg:#FFEBEE;--red-light:#FFCDD2;
  --blue:#1565C0;--blue-bg:#E3F2FD;
  --gold:#FF8F00;--gold-bg:#FFF8E1;--gold-light:#FFE082;
  --header-grad:linear-gradient(135deg,#1565C0 0%,#0D47A1 50%,#002171 100%);
  --total-bg:#FFF8E1;--total-border:#FFB300;
  --hover:#E8F0FE;--shadow:0 2px 8px rgba(13,71,161,.06);--shadow-lg:0 4px 16px rgba(13,71,161,.12);
  --radius:10px;--radius-sm:6px;
  --th-dim:#37474F;--th-monthly:#1565C0;--th-monthly-h-1:#1976D2;--th-monthly-h-2:#1565C0;
  --th-yearly:#F57C00;--th-yearly-h-1:#FB8C00;--th-yearly-h-2:#F57C00;
  --toggle-bg:rgba(255,255,255,.15);--toggle-border:rgba(255,255,255,.3);
  --accent-glow:0 0 12px rgba(21,101,192,.2);
}
[data-theme="dark"]{
  --bg:#F0F6FC;--card:#FFFFFF;--border:#BBDEFB;--border-2:#E1F0FA;
  --text:#0D2638;--text-2:#455A64;--text-3:#78909C;--text-4:#B0BEC5;
  --green:#00897B;--green-bg:#E0F2F1;--green-light:#B2DFDB;
  --red:#E53935;--red-bg:#FFEBEE;--red-light:#FFCDD2;
  --blue:#1565C0;--blue-bg:#E3F2FD;
  --gold:#FF8F00;--gold-bg:#FFF8E1;--gold-light:#FFE082;
  --brand-light:#E3F2FD;--header-grad:linear-gradient(135deg,#0D47A1 0%,#002171 50%,#001A4D 100%);
  --total-bg:#FFF8E1;--total-border:#FFB300;
  --hover:#E8F0FE;--shadow:0 2px 8px rgba(13,71,161,.08);--shadow-lg:0 4px 16px rgba(13,71,161,.14);
  --th-dim:#37474F;--th-monthly:#1565C0;--th-monthly-h-1:#1976D2;--th-monthly-h-2:#1565C0;
  --th-yearly:#F57C00;--th-yearly-h-1:#FB8C00;--th-yearly-h-2:#F57C00;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}

/* ===== Header ===== */
.app-header{background:var(--header-grad);padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(13,71,161,.3),inset 0 -1px 0 rgba(255,255,255,.1);position:sticky;top:0;z-index:100;border-bottom:2px solid rgba(255,191,0,.4)}
.app-header h1{font-size:20px;color:#fff;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:10px;text-shadow:0 0 20px rgba(66,165,245,.5)}
.app-header h1::before{content:"";display:inline-block;width:5px;height:24px;background:linear-gradient(180deg,#FFB300,#FF8F00);border-radius:2px;box-shadow:0 0 8px rgba(255,179,0,.6)}
.header-date{font-size:13px;font-weight:400;opacity:.9;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px}
.upload-info{font-size:12px;color:rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;font-weight:600}
.btn-upload{background:rgba(255,255,255,.95);color:var(--brand-dark)}
.btn-upload:hover{background:#fff;transform:translateY(-1px);box-shadow:0 2px 8px rgba(21,101,192,.2)}
.btn-logout{background:rgba(255,179,0,.2);color:#FFE082;border:1px solid rgba(255,179,0,.4)}
.btn-logout:hover{background:rgba(255,179,0,.35)}
.btn-theme{background:transparent;color:rgba(255,255,255,.85);border:none;font-size:18px;padding:4px 6px;line-height:1;cursor:pointer;transition:all .2s}
.btn-theme:hover{color:#fff;transform:scale(1.15)}

/* ===== Tabs ===== */
.tab-bar{display:flex;gap:4px;padding:12px 28px 0;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 24px;border-radius:var(--radius) var(--radius) 0 0;font-size:14px;cursor:pointer;color:var(--text-2);border:1px solid transparent;border-bottom:none;transition:all .2s;white-space:nowrap;position:relative;top:1px;display:flex;align-items:center;gap:6px;font-weight:500}
.tab:hover{background:var(--hover);color:var(--text)}
.tab.active{background:var(--brand-grad);color:#fff;border-color:var(--border);border-bottom-color:var(--card);font-weight:700;box-shadow:0 -2px 8px rgba(21,101,192,.3)}
.tab .count{display:inline-block;background:var(--border-2);color:var(--text-3);border-radius:10px;padding:1px 8px;font-size:11px;min-width:20px;text-align:center;font-weight:500}
.tab.active .count{background:rgba(255,255,255,.25);color:#fff}

/* ===== Content ===== */
.content{padding:20px 28px;max-width:1440px;margin:0 auto}
.search-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:260px}
.search-input{width:100%;padding:11px 16px 11px 40px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;outline:none;transition:all .2s;background:var(--card);color:var(--text);-webkit-appearance:none}
.search-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,101,192,.12)}
.search-input::placeholder{color:var(--text-4)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:16px;pointer-events:none}

/* ===== Button Group ===== */
.btn-group{display:flex;gap:12px;flex-wrap:wrap}
.btn-tab{padding:12px 32px;border:2px solid var(--border);border-radius:var(--radius);font-size:15px;cursor:pointer;background:var(--card);color:var(--text-2);transition:all .25s;font-weight:600;user-select:none;position:relative;overflow:hidden}
.btn-tab:hover{border-color:var(--brand);color:#42A5F5;transform:translateY(-2px);box-shadow:0 4px 12px rgba(21,101,192,.15)}
.btn-tab.active{background:var(--brand-grad);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(21,101,192,.3),var(--accent-glow);text-shadow:0 0 8px rgba(255,255,255,.3)}
.btn-tab.active::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#FFB300,transparent)}

/* ===== Entity Card ===== */
.entity-card{background:var(--card);border-radius:var(--radius);padding:14px 20px;margin-bottom:12px;box-shadow:var(--shadow);border-left:4px solid var(--brand);background-image:linear-gradient(135deg,rgba(21,101,192,.04) 0%,transparent 50%)}
.entity-card h2{font-size:18px;color:var(--brand);margin:0;font-weight:800;white-space:nowrap;text-shadow:0 0 16px rgba(21,101,192,.2)}
.entity-card.compact{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px}
.entity-card.compact h2{flex-shrink:0}
.entity-card h3{font-size:16px;color:var(--text);margin-bottom:6px}
.entity-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--text-2)}
.entity-meta .tag{background:var(--bg);padding:3px 12px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.entity-meta .tag b{color:var(--text);font-weight:700}

/* ===== Stats Row ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:8px 16px;box-shadow:var(--shadow);border-top:3px solid var(--border-2);transition:all .25s;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;overflow:hidden}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.stat-card.green{border-top-color:var(--green)}
.stat-card.red{border-top-color:var(--red)}
.stat-card .info{flex:0 1 auto;min-width:0;text-align:left}
.stat-card .label{font-size:13px;color:var(--text-2);font-weight:700;line-height:1.3;white-space:nowrap}
.stat-card .sub{font-size:10px;color:var(--text-3);line-height:1.3;margin-top:1px;white-space:nowrap}
.stat-card .value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);line-height:1;flex-shrink:0;letter-spacing:-.5px}
.stat-card .value.pos{color:var(--green);text-shadow:0 0 12px rgba(0,137,123,.2)}
.stat-card .value.neg{color:var(--red);text-shadow:0 0 12px rgba(229,57,53,.2)}

/* ===== Section Title ===== */
.section-title{font-size:16px;font-weight:700;color:var(--text);margin:22px 0 10px;padding:6px 12px;border-left:4px solid var(--brand);display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(21,101,192,.06) 0%,transparent 100%);border-radius:0 var(--radius-sm) var(--radius-sm) 0;text-transform:none}
.section-title::before{content:"";display:inline-block;width:8px;height:8px;background:var(--brand);border-radius:50%;box-shadow:0 0 8px var(--brand);animation:sectionPulse 2s ease-in-out infinite}
@keyframes sectionPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

/* ===== Data Table ===== */
.data-table-wrap{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
table.data-table thead{background:var(--header-grad)}
table.data-table th{color:#fff;padding:10px 12px;text-align:center;font-weight:600;white-space:nowrap;border-right:1px solid rgba(255,255,255,.15);cursor:pointer;user-select:none;transition:background .15s;position:relative}
table.data-table th:hover{background:rgba(255,255,255,.12)}
table.data-table th:last-child{border-right:none}
table.data-table th:first-child{text-align:center;padding-left:12px}
table.data-table th.sort-asc::after{content:" \25B2";font-size:9px;opacity:.7}
table.data-table th.sort-desc::after{content:" \25BC";font-size:9px;opacity:.7}
table.data-table th.no-sort{cursor:default}
table.data-table th.no-sort:hover{background:transparent}
/* Dimension headers */
th.dim-header{background:linear-gradient(135deg,var(--th-dim) 0%,var(--th-dim) 100%)!important}
/* Monthly group - red gradient */
th.group-monthly-h{background:linear-gradient(135deg,var(--th-monthly-h-1) 0%,var(--th-monthly-h-2) 100%)!important}
th.group-monthly{background:var(--th-monthly)!important}
th.group-monthly:hover{background:var(--th-monthly-h-1)!important}
/* Yearly group - orange gradient */
th.group-yearly-h{background:linear-gradient(135deg,var(--th-yearly-h-1) 0%,var(--th-yearly-h-2) 100%)!important}
th.group-yearly{background:var(--th-yearly)!important}
th.group-yearly:hover{background:var(--th-yearly-h-1)!important}
table.data-table td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--border-2);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data-table td:first-child{text-align:center;padding-left:12px;font-weight:600;color:var(--text)}
table.data-table td.label-col{text-align:center;color:var(--text-2);font-weight:400}
table.data-table tbody tr:hover{background:var(--hover)}
table.data-table tbody tr.total-row{background:var(--total-bg);font-weight:800}
table.data-table tbody tr.total-row td{border-top:2px solid var(--total-border);color:var(--text)}
td.pos{color:var(--green)!important;font-weight:700}
td.neg{color:var(--red)!important;font-weight:700}
.col-group{border-left:1px solid rgba(255,255,255,.15)}
.col-group:first-child{border-left:none}
.sub-header{font-size:11px!important;font-weight:400!important}

/* ===== Search Results ===== */
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:360px;overflow-y:auto;z-index:200;display:none}
.search-results.show{display:block}
.search-result-item{padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--border-2);font-size:13px;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.search-result-item:hover{background:rgba(21,101,192,.08)}
.search-result-item:last-child{border-bottom:none}
.search-result-item .name{font-weight:600;color:var(--text)}
.search-result-item .meta{font-size:11px;color:var(--text-3)}
.search-result-item .meta .badge{display:inline-block;background:var(--bg);padding:1px 6px;border-radius:3px;margin-left:4px}

/* ===== Upload Zone ===== */
.upload-status{margin-bottom:16px;padding:14px 20px;border-radius:var(--radius);font-size:13px;display:none;align-items:center;gap:8px}
.upload-status.success{background:var(--green-bg);color:var(--green);display:flex;border:1px solid var(--green-light)}
.upload-status.error{background:var(--red-bg);color:var(--red);display:flex;border:1px solid var(--red-light)}
.upload-status.info{background:var(--blue-bg);color:var(--blue);display:flex;border:1px solid rgba(255,152,0,.3)}

/* ===== Drag & Drop Overlay ===== */
.drop-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(21,101,192,.08);z-index:9999;align-items:center;justify-content:center;pointer-events:none}
.drop-overlay.active{display:flex}
.drop-zone{background:#fff;border:3px dashed var(--brand);border-radius:20px;padding:60px 80px;text-align:center;box-shadow:0 8px 32px rgba(13,71,161,.15);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.drop-zone .drop-icon{font-size:52px;margin-bottom:12px}
.drop-zone .drop-text{font-size:20px;font-weight:700;color:var(--brand)}
.drop-zone .drop-hint{font-size:13px;color:var(--text-3);margin-top:6px}

/* ===== Footer ===== */
.app-footer{padding:16px 28px;text-align:center;font-size:12px;color:var(--text-3);border-top:1px solid var(--border);background:var(--card)}
.legend{display:inline-block;margin:0 10px}
.screenshot-btn{margin-top:8px;padding:8px 24px;background:var(--brand-grad);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:all .2s;font-weight:600;letter-spacing:1px}
.screenshot-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(21,101,192,.3)}

/* ===== Placeholder ===== */
.placeholder-card{background:var(--card);border-radius:var(--radius);padding:48px 32px;text-align:center;color:var(--text-3);box-shadow:var(--shadow)}
.placeholder-card .icon{font-size:42px;margin-bottom:12px;opacity:.4}
.placeholder-card p{font-size:14px}

@media(max-width:900px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .app-header{padding:0 14px;height:52px}
  .app-header h1{font-size:15px}
  .content{padding:14px}
  .tab-bar{padding:8px 14px 0}
  .tab{padding:8px 14px;font-size:13px}
  table.data-table{font-size:11px}
  table.data-table th,table.data-table td{padding:6px 8px}
}

  .app-header{padding:0 12px;height:48px}
  .app-header h1{font-size:14px;white-space:nowrap}
  .header-right{gap:6px}
  .btn-upload,.btn-logout{padding:6px 10px;font-size:12px;white-space:nowrap}
  .btn-theme{padding:6px 8px;font-size:14px}

  .tab .count{font-size:10px;min-width:16px;height:16px;line-height:16px;margin-left:4px}
  .search-bar{flex-direction:column;gap:8px;align-items:stretch}
  .search-wrap{width:100%}
  .btn-group{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}

  table.data-table th.dim-header,table.data-table th.group-monthly-h,table.data-table th.group-yearly-h{font-size:10px!important;line-height:1.2;white-space:normal;word-break:keep-all}

  .screenshot-btn{margin-top:6px;padding:6px 14px;font-size:12px}
  .search-results{max-height:280px}
  .auth-box{width:90%;max-width:340px;padding:36px 28px}
  .auth-title{font-size:28px}

}

@media(max-width:480px){
  .app-header h1{font-size:13px}
  .header-date{font-size:10px}

  .content{padding:8px}
  .tab{padding:6px 10px;font-size:11px}
  .stats-row{grid-template-columns:1fr 1fr;gap:6px}
  .stat-card{padding:8px 10px}
  .stat-card .value{font-size:16px}

  .stat-card .sub{font-size:10px}

  table.data-table th,table.data-table td{padding:3px 1px;text-align:center;white-space:nowrap}
  table.data-table th.dim-header,table.data-table th.group-monthly-h,table.data-table th.group-yearly-h{font-size:9px!important;line-height:1.2;white-space:normal;word-break:keep-all}
  table.data-table th.sub-header{font-size:7px!important;line-height:1.2;white-space:normal;word-break:keep-all}
  .section-title{font-size:13px}
  .btn-tab{padding:7px 12px;font-size:12px}

}
/* ===== Auth Overlay ===== */
.auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#E3F2FD 0%,#BBDEFB 35%,#90CAF9 65%,#64B5F6 100%);z-index:9999;display:flex;align-items:center;justify-content:center}
.auth-overlay::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 50% 30%,rgba(255,179,0,.1) 0%,transparent 60%);pointer-events:none}
.auth-box{text-align:center;width:360px;padding:48px 40px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(13,71,161,.2),0 0 0 1px rgba(21,101,192,.1);position:relative;border-top:3px solid var(--brand)}
.auth-logo{font-size:16px;color:var(--text-3);letter-spacing:3px;margin-bottom:8px;font-weight:500}
.auth-title{font-size:32px;font-weight:800;background:linear-gradient(135deg,#1565C0 0%,#0D47A1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;letter-spacing:2px}
.auth-subtitle{font-size:14px;color:var(--text-3);margin-bottom:28px}
.auth-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:10px;font-size:16px;outline:none;transition:all .2s;text-align:center;letter-spacing:2px;box-sizing:border-box;background:#FAFAFA;color:var(--text)}
.auth-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,101,192,.12)}
.auth-btn{width:100%;padding:14px;margin-top:16px;background:var(--brand-grad);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:4px}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(21,101,192,.3)}
.auth-btn:active{transform:translateY(0)}

function fmt(v){return v==null||isNaN(v)?"-":String(Math.round(v))}
function fmtPct(v){if(v==null||isNaN(v))return"-";return(v>=0?"+":"")+Math.round(v*100)+"%"}
function fmtGap(v){if(v==null||isNaN(v))return"-";return(v>=0?"+":"")+fmt(v)}
function cls(v){if(v==null||isNaN(v)||v===0)return"";return v>=0?"pos":"neg"}
function sortedUniq(arr){var s={};arr.forEach(function(a){s[a]=1});return Object.keys(s).sort()}
function num(v){try{return v==null?0:parseFloat(v)||0}catch(e){return 0}}

function aggregate(rows,dim){
  var g={};
  rows.forEach(function(r){
    var k=r[dim]||"(未知)";
    if(!g[k])g[k]={已发货:0,开单未提货:0,去年同期:0,本年发货:0,去年发货:0,count:0,大区:r["大区"]||"",渠道:r["渠道"]||"",运营中心:r["运营中心"]||""};
    g[k].已发货+=r["已发货"]||0;g[k].开单未提货+=r["开单未提货"]||0;g[k].去年同期+=r["去年同期"]||0;g[k].本年发货+=r["本年发货"]||0;g[k].去年发货+=r["去年发货"]||0;g[k].count++;
  });
  var out=[];
  Object.keys(g).forEach(function(k){
    var v=g[k],mGap=v.已发货-v.去年同期,yGap=v.本年发货-v.去年发货;
    out.push({name:k,大区:v.大区,渠道:v.渠道,运营中心:v.运营中心,count:v.count,
      mShipped:+v.已发货.toFixed(1),mUnshipped:+v.开单未提货.toFixed(1),mLy:+v.去年同期.toFixed(1),mGap:+mGap.toFixed(1),mRate:v.去年同期?mGap/v.去年同期:0,
      yShipped:+v.本年发货.toFixed(1),yLy:+v.去年发货.toFixed(1),yGap:+yGap.toFixed(1),yRate:v.去年发货?yGap/v.去年发货:0});
  });
  return out;
}

function totalRow(rows){
  var s={已发货:0,开单未提货:0,去年同期:0,本年发货:0,去年发货:0};
  rows.forEach(function(r){s.已发货+=r["已发货"]||0;s.开单未提货+=r["开单未提货"]||0;s.去年同期+=r["去年同期"]||0;s.本年发货+=r["本年发货"]||0;s.去年发货+=r["去年发货"]||0});
  var mGap=s.已发货-s.去年同期,yGap=s.本年发货-s.去年发货;
  return{mShipped:+s.已发货.toFixed(1),mUnshipped:+s.开单未提货.toFixed(1),mLy:+s.去年同期.toFixed(1),mGap:+mGap.toFixed(1),mRate:s.去年同期?mGap/s.去年同期:0,
    yShipped:+s.本年发货.toFixed(1),yLy:+s.去年发货.toFixed(1),yGap:+yGap.toFixed(1),yRate:s.去年发货?yGap/s.去年发货:0};
}

function getVisibleCols(dimLabel,showOps,showChannel,showRegion){
  var cols=[{field:"name",label:dimLabel,numeric:false,sortKey:"name"}];
  if(showOps)cols.push({field:"运营中心",label:"运营中心",numeric:false,sortKey:"运营中心"});
  if(showRegion)cols.push({field:"区域",label:"区域",numeric:false,sortKey:"区域"});
  if(showChannel)cols.push({field:"渠道",label:"渠道",numeric:false,sortKey:"渠道"});
  cols.push({field:"mShipped",label:"已发货",numeric:true,sortKey:"mShipped",group:"当月发货(万)"});
  cols.push({field:"mLy",label:"同期",numeric:true,sortKey:"mLy",group:"当月发货(万)"});
  cols.push({field:"mGap",label:"增长缺口",numeric:true,sortKey:"mGap",group:"当月发货(万)",gap:true});
  cols.push({field:"mRate",label:"增长率",numeric:true,sortKey:"mRate",group:"当月发货(万)",rate:true});
  cols.push({field:"yShipped",label:"已发货",numeric:true,sortKey:"yShipped",group:"当年发货(万)"});
  cols.push({field:"yLy",label:"同期",numeric:true,sortKey:"yLy",group:"当年发货(万)"});
  cols.push({field:"yGap",label:"增长缺口",numeric:true,sortKey:"yGap",group:"当年发货(万)",gap:true});
  cols.push({field:"yRate",label:"增长率",numeric:true,sortKey:"yRate",group:"当年发货(万)",rate:true});
  return cols;
}

var tableSeq=0;

function renderTableRows(rows,cols,baseColSpan,totalRowData){
  var html="";
  rows.forEach(function(r){
    html+='<tr>';
    cols.forEach(function(c){
      var v=r[c.field];
      if(!c.numeric){
        html+='<td class="dim-col">'+(v||"-")+'</td>';
      }else if(c.gap){
        html+='<td class="'+cls(v)+'">'+fmtGap(v)+'</td>';
      }else if(c.rate){
        html+='<td class="'+cls(v)+'">'+fmtPct(v)+'</td>';
      }else{
        html+='<td>'+fmt(v)+'</td>';
      }
    });
    html+='</tr>';
  });
  var s,label;
  if(totalRowData){
    s=totalRowData;
    label="北部战区";
  }else{
    s={mShipped:0,mLy:0,yShipped:0,yLy:0};
    rows.forEach(function(r){s.mShipped+=r.mShipped||0;s.mLy+=r.mLy||0;s.yShipped+=r.yShipped||0;s.yLy+=r.yLy||0});
    label="合计";
  }
  var tmGap=s.mShipped-s.mLy,tyGap=s.yShipped-s.yLy;
  html+='<tr class="total-row">';
  html+='<td class="dim-col" colspan="'+baseColSpan+'">'+label+'</td>';
  html+='<td>'+fmt(s.mShipped)+'</td><td>'+fmt(s.mLy)+'</td><td class="'+cls(tmGap)+'">'+fmtGap(tmGap)+'</td><td class="'+cls(s.mLy?tmGap/s.mLy:0)+'">'+fmtPct(s.mLy?tmGap/s.mLy:0)+'</td>';
  html+='<td>'+fmt(s.yShipped)+'</td><td>'+fmt(s.yLy)+'</td><td class="'+cls(tyGap)+'">'+fmtGap(tyGap)+'</td><td class="'+cls(s.yLy?tyGap/s.yLy:0)+'">'+fmtPct(s.yLy?tyGap/s.yLy:0)+'</td>';
  html+='</tr>';
  return html;
}

function buildTable(rows,dimLabel,showOps,showChannel,totalRowData,showRegion){
  var tableId="tbl_"+(++tableSeq);
  tableSources[tableId]={rows:rows,dimLabel:dimLabel,showOps:showOps,showChannel:showChannel,showRegion:showRegion||false,totalRowData:totalRowData||null};
  var cols=getVisibleCols(dimLabel,showOps,showChannel,showRegion);
  var baseColSpan=cols.filter(function(c){return!c.group}).length;
  var html='<div class="data-table-wrap"><table class="data-table" id="'+tableId+'"><thead>';
  html+='<tr>';
  cols.forEach(function(c){
    if(!c.group){html+='<th rowspan="2" class="no-sort dim-header" data-col="'+c.sortKey+'">'+c.label+'</th>';}
  });
  html+='<th class="col-group no-sort group-monthly-h" colspan="4">当月发货(万)</th><th class="col-group no-sort group-yearly-h" colspan="4">当年发货(万)</th></tr>';
  html+='<tr>';
  cols.forEach(function(c){
    if(c.group){
      var gCls=c.group==="当月发货(万)"?"group-monthly":"group-yearly";
      var clsStr="col-group sub-header "+gCls;
      html+='<th class="'+clsStr+'" data-col="'+c.sortKey+'" data-table="'+tableId+'" onclick="sortByCol(\''+tableId+'\',\''+c.sortKey+'\')">'+c.label+'</th>';
    }
  });
  html+='</tr></thead><tbody id="'+tableId+'_body">';
  html+=renderTableRows(rows,cols,baseColSpan,totalRowData);
  html+='</tbody></table></div>';
  return html;
}

function buildTableWithSource(rows,dimLabel,showOps,showChannel,totalRowData,showRegion){
  return buildTable(rows,dimLabel,showOps,showChannel,totalRowData,showRegion);
}

function sortByCol(tableId,colKey){
  var tbl=document.getElementById(tableId);
  if(!tbl)return;
  var state=sortState[tableId]||{col:null,dir:"desc"};
  if(state.col===colKey){state.dir=state.dir==="asc"?"desc":"asc";}
  else{state.col=colKey;state.dir="desc";}
  sortState[tableId]=state;
  tbl.querySelectorAll("th[data-col]").forEach(function(th){
    th.classList.remove("sort-asc","sort-desc");
    if(th.dataset.col===colKey&&th.dataset.table===tableId){
      th.classList.add(state.dir==="asc"?"sort-asc":"sort-desc");
    }
  });
  var src=tableSources[tableId];
  if(!src)return;
  var sorted=src.rows.slice().sort(function(a,b){
    var av=a[colKey],bv=b[colKey];
    if(typeof av==="number"&&typeof bv==="number"){return state.dir==="asc"?av-bv:bv-av;}
    return state.dir==="asc"?String(av||"").localeCompare(String(bv||"")):String(bv||"").localeCompare(String(av||""));
  });
  var cols=getVisibleCols(src.dimLabel,src.showOps,src.showChannel,src.showRegion);
  var baseColSpan=cols.filter(function(c){return!c.group}).length;
  document.getElementById(tableId+"_body").innerHTML=renderTableRows(sorted,cols,baseColSpan,src.totalRowData);
}

function buildStatsCards(tot){
  var mCls=tot.mRate>=0?"green":"red";
  var yCls=tot.yRate>=0?"green":"red";
  return '<div class="stats-row">'+
    '<div class="stat-card"><div class="info"><div class="label">当月已发货(万)</div><div class="sub">同期 '+fmt(tot.mLy)+'</div></div><div class="value">'+fmt(tot.mShipped)+'</div></div>'+
    '<div class="stat-card '+mCls+'"><div class="info"><div class="label">当月增长率</div><div class="sub">缺口 '+fmtGap(tot.mGap)+'</div></div><div class="value '+cls(tot.mRate)+'">'+fmtPct(tot.mRate)+'</div></div>'+
    '<div class="stat-card"><div class="info"><div class="label">当年已发货(万)</div><div class="sub">同期 '+fmt(tot.yLy)+'</div></div><div class="value">'+fmt(tot.yShipped)+'</div></div>'+
    '<div class="stat-card '+yCls+'"><div class="info"><div class="label">当年增长率</div><div class="sub">缺口 '+fmtGap(tot.yGap)+'</div></div><div class="value '+cls(tot.yRate)+'">'+fmtPct(tot.yRate)+'</div></div>'+
    '</div>';
}

  if(ALL_DATA.length>0)return ALL_DATA;
  return [];
}
function getOpsData(){
  if(DATA_BY_OPS.length>0)return DATA_BY_OPS.filter(function(r){return r["大区"]===REGION_NAME||r["名称"]==="合计"});
  if(ALL_DATA.length>0)return ALL_DATA;

}

}

function getSubGroup(r){
  for(var mc in CHANNEL_SUB_GROUPS){
    var groups=CHANNEL_SUB_GROUPS[mc];
    for(var sg in groups){
      var rule=groups[sg];
      if(rule.ops&&(rule.ops.indexOf(r["运营中心"])>=0))return sg;
      if(rule.regions&&rule.regions.indexOf(r["大区"])>=0)return sg;
    }
  }
  return null;
}

  box.innerHTML=matches.map(function(d){
    var row=getDealerData().filter(function(r){return r["名称"]===d})[0]||{};
    return '<div class="search-result-item" onclick="selectDealer(\''+d.replace(/'/g,"\\'")+'\')"><span class="name">'+d+'</span><span class="meta">'+(row.运营中心||"")+'<span class="badge">'+(row.渠道||"")+'</span></span></div>';

function selectDealer(name){
  document.getElementById("dealerSearch").value=name;
  document.getElementById("searchResults").classList.remove("show");
  showDealerDetail(name);
}

function searchDealer(){
  var q=document.getElementById("dealerSearch").value.trim();
  if(!q)return;
  var matches=DEALERS.filter(function(d){return d.toLowerCase().indexOf(q.toLowerCase())>=0});
  if(matches.length===0){document.getElementById("dealerResult").innerHTML='<div class="placeholder-card"><div class="icon">\u274C</div><p>未找到匹配的经销商</p></div>';return}
  if(matches.length===1){showDealerDetail(matches[0]);return}
  var dealerData=getDealerData();
  var rows=matches.map(function(m){
    var dr=dealerData.filter(function(r){return r["名称"]===m});
    var t=totalRow(dr);
    return{name:m,大区:REGION_NAME,渠道:dr[0]?dr[0]["渠道"]:"",运营中心:dr[0]?dr[0]["运营中心"]:"",count:dr.length,mShipped:t.mShipped,mLy:t.mLy,mGap:t.mGap,mRate:t.mRate,yShipped:t.yShipped,yLy:t.yLy,yGap:t.yGap,yRate:t.yRate};

  var html='<div class="entity-card"><h3>找到 '+matches.length+' 个匹配经销商</h3></div>';
  html+=buildTableWithSource(rows,"经销商名称",true,true);
  document.getElementById("dealerResult").innerHTML=html;
}

function showDealerDetail(name){
  var rows=getDealerData().filter(function(r){return r["名称"]===name});
  if(rows.length===0)return;
  var r0=rows[0],chSet={},chOrder=["零售","优选","家装","工程"];
  rows.forEach(function(r){chSet[r["渠道"]]=true});
  var channels=chOrder.filter(function(c){return chSet[c]}).concat(Object.keys(chSet).filter(function(c){return chOrder.indexOf(c)<0}));
  var tot=totalRow(rows);
  var html='<div class="entity-card"><h2>'+name+'</h2><div class="entity-meta">'+
    '<span class="tag">大区: <b>'+REGION_NAME+'</b></span>'+
    '<span class="tag">运营中心: <b>'+(r0["运营中心"]||"-")+'</b></span>'+
    '<span class="tag">渠道: <b>'+channels.join("/")+'</b></span>'+
    '<span class="tag">编码: <b>'+(r0["编码"]||"-")+'</b></span></div></div>';
  html+=buildStatsCards(tot);
  html+='<div class="section-title">分渠道发货数据</div>';
  var byCh=aggregate(rows,"渠道").sort(function(a,b){
    var ai=chOrder.indexOf(a.name),bi=chOrder.indexOf(b.name);
    if(ai<0)ai=99;if(bi<0)bi=99;
    return ai-bi;
  });
  html+=buildTableWithSource(byCh,"渠道",false,false);
  document.getElementById("dealerResult").innerHTML=html;
}

function getCumulativeTask(row,monthNum){
  var keys=["aug","sep","oct","nov","dec"];
  var sum=0;
  for(var i=0;i<monthNum-7;i++){
    if(i<keys.length)sum+=row[keys[i]]||0;
  }
  return Math.round(sum*10)/10;
}

function getRemainingDays(){
  var now=new Date();
  var year=now.getFullYear(),month=now.getMonth();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var today=now.getDate();
  return daysInMonth-today;
}

// ===== Excel Upload =====
function handleUpload(event){
  var file=event.target.files[0];
  if(!file)return;
  processFile(file);
}

function processFile(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:"array"});
      var isV2=wb.SheetNames.some(function(sn){return sn.indexOf("一级部门")>=0});
      var rowsRegion,rowsOps,rowsDealer;
      if(isV2){
        var res=parseV2Format(wb);
        rowsRegion=res.region;
        rowsOps=res.ops;
        rowsDealer=res.dealer;
      }else{
        var sheetRegion=null,sheetOps=null,sheetDealer=null;
        wb.SheetNames.forEach(function(sn){
          if(sn.indexOf("大区")>=0&&sn.indexOf("上")>=0)sheetRegion=sn;
          else if(sn.indexOf("运营中心")>=0&&sn.indexOf("上")>=0&&sn.indexOf("全渠道")<0)sheetOps=sn;
          if(sn.indexOf("经销商")>=0&&(sn.indexOf("AW")>=0||sn.indexOf("上")>=0))sheetDealer=sn;
        });
        if(!sheetRegion){showUploadStatus("error","\u274C 未找到大区工作表");return}
        rowsRegion=parseSummarySheet(XLSX.utils.sheet_to_json(wb.Sheets[sheetRegion],{header:1,defval:null}),"大区");
        rowsOps=sheetOps?parseSummarySheet(XLSX.utils.sheet_to_json(wb.Sheets[sheetOps],{header:1,defval:null}),"运营中心"):[];
        rowsDealer=sheetDealer?parseDealerSheet(XLSX.utils.sheet_to_json(wb.Sheets[sheetDealer],{header:1,defval:null})):[];
        rowsRegion=rowsRegion.filter(function(r){return r["大区"]===REGION_NAME||r["名称"]==="合计"});
        rowsOps=rowsOps.filter(function(r){return r["大区"]===REGION_NAME||r["名称"]==="合计"});
        if(rowsDealer.length>0)rowsDealer=rowsDealer.filter(function(r){return r["大区"]===REGION_NAME||r["名称"]==="合计"});
      }
      DATA_BY_REGION=rowsRegion;
      DATA_BY_OPS=rowsOps.length>0?rowsOps:rowsRegion;
      if(rowsDealer.length>0)ALL_DATA=rowsDealer;
      ALL_REGIONS=["北区"];
      ALL_CHANNELS=sortedUniq(DATA_BY_REGION.map(function(r){return r["渠道"]}).filter(function(v){return v&&v!=="合计"}));
      ALL_OPS=sortedUniq(DATA_BY_OPS.map(function(r){return r["运营中心"]}).filter(function(v){return v&&v!=="合计"&&v!=="-"&&v!=="/"&&v!=="小计"}));
      DEALERS=sortedUniq(ALL_DATA.filter(function(r){return r["名称"]!=="合计"&&r["编码"]&&!isExcludedDealer(r["名称"])}).map(function(r){return r["名称"]}));
      showUploadStatus("success","\u2705 成功导入北部战区数据: 大区表 "+rowsRegion.length+" 行, 运营中心表 "+rowsOps.length+" 行"+(rowsDealer.length>0?", 经销商 "+rowsDealer.length+" 行":""));
      var today=new Date();
      var dateStr=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
      updateDataDate(dateStr);
      saveToCloud({region:rowsRegion,ops:rowsOps,dealer:rowsDealer},file.name,dateStr);
      var activeTab=document.querySelector(".tab.active");
      if(activeTab)switchView(activeTab.dataset.view);
    }catch(err){showUploadStatus("error","\u274C 解析失败: "+err.message)}
  };
  reader.readAsArrayBuffer(file);
  showUploadStatus("info","\u23F3 正在解析 "+file.name+"...");
}

function parseV2Format(wb){
  var TARGET="北部战区";
  var rowsRegion=[],rowsOps=[],rowsDealer=[];
  var northTotal={已发货:0,当日开单:0,去年同期:0,本年发货:0,去年发货:0};

  // === 一级部门 sheet: 战区×渠道 ===
  var sn1=wb.SheetNames.find(function(s){return s.indexOf("一级部门")>=0});
  if(sn1){
    var json1=XLSX.utils.sheet_to_json(wb.Sheets[sn1],{header:1,defval:null});
    for(var i=3;i<json1.length;i++){
      var r=json1[i];if(!r||!r[0])continue;
      var dept=String(r[2]||"").trim();
      if(dept===TARGET){
        var ch=String(r[1]||"").trim();
        rowsRegion.push({大区:"北区",渠道:ch,名称:TARGET,
          已发货:num(r[6])+num(r[8]),当日开单:num(r[4]),去年同期:num(r[12]),本年发货:num(r[16]),去年发货:num(r[19])});
        northTotal.已发货+=num(r[6])+num(r[8]);northTotal.当日开单+=num(r[4]);
        northTotal.去年同期+=num(r[12]);northTotal.本年发货+=num(r[16]);northTotal.去年发货+=num(r[19]);
      }
    }
  }
  rowsRegion.unshift({大区:"北区",渠道:"合计",名称:"合计",
    已发货:Math.round(northTotal.已发货*100)/100,当日开单:Math.round(northTotal.当日开单*100)/100,
    去年同期:Math.round(northTotal.去年同期*100)/100,
    本年发货:Math.round(northTotal.本年发货*100)/100,去年发货:Math.round(northTotal.去年发货*100)/100});

  // === 二级部门 sheet: 运营中心×渠道 ===
  var sn2=wb.SheetNames.find(function(s){return s.indexOf("二级部门")>=0});
  if(sn2){
    var json2=XLSX.utils.sheet_to_json(wb.Sheets[sn2],{header:1,defval:null});
    for(var i=3;i<json2.length;i++){
      var r=json2[i];if(!r||!r[0])continue;
      var dept=String(r[2]||"").trim();
      var oc=String(r[3]||"").trim();
      if(dept===TARGET&&oc&&oc!=="小计"&&oc!=="None"){
        var ocName=oc.replace("运营中心","");
        rowsOps.push({大区:"北区",渠道:String(r[1]||"").trim(),运营中心:ocName,名称:ocName,
          已发货:num(r[7])+num(r[9]),当日开单:num(r[5]),去年同期:num(r[13]),本年发货:num(r[17]),去年发货:num(r[20])});
      }
    }
  }
  rowsOps.push({大区:"北区",渠道:"合计",运营中心:"合计",名称:"合计",
    已发货:Math.round(northTotal.已发货*100)/100,当日开单:Math.round(northTotal.当日开单*100)/100,
    去年同期:Math.round(northTotal.去年同期*100)/100,
    本年发货:Math.round(northTotal.本年发货*100)/100,去年发货:Math.round(northTotal.去年发货*100)/100});

  // === 经销商 sheet ===
  var sn4=wb.SheetNames.find(function(s){return s.indexOf("经销商")>=0&&s.indexOf("AW")>=0});
  if(!sn4)sn4=wb.SheetNames.find(function(s){return s.indexOf("经销商")>=0});
  if(sn4){
    var json4=XLSX.utils.sheet_to_json(wb.Sheets[sn4],{header:1,defval:null});
    for(var i=3;i<json4.length;i++){
      var r=json4[i];if(!r||!r[0])continue;
      var dept=String(r[2]||"").trim();
      var code=String(r[5]||"").trim();
      var name=String(r[6]||"").trim();
      if(dept===TARGET&&code&&code!=="小计"&&code!=="None"&&code!==""){
        var ocName=String(r[3]||"").trim().replace("运营中心","");
        var salesRep=String(r[4]||"").trim();
        name=mergeDealerName(name);
        if(!isExcludedDealer(name)){
          rowsDealer.push({大区:"北区",渠道:String(r[1]||"").trim(),运营中心:ocName,
            销售代表:salesRep,
            区域:ocName+String(r[1]||"").trim(),编码:code,名称:name,
            已发货:num(r[10])+num(r[12]),当日开单:num(r[8]),去年同期:num(r[16]),本年发货:num(r[20]),去年发货:num(r[23])});
        }
      }
    }
  }
  return{region:rowsRegion,ops:rowsOps,dealer:rowsDealer};
}

function parseDealerSheet(json){
  var rows=[];
  var curSyb=null,curCh=null,curDq=null,curOc=null;
  for(var i=2;i<json.length;i++){
    var r=json[i];
    if(!r||r.every?r.every(function(v){return v==null||v===""}):true)continue;
    if(r[0]==="合计"){
      rows.push({"事业部":"","渠道":"","大区":"","运营中心":"","区域":"","编码":"","名称":"合计",
        "已发货":num(r[10]),"去年同期":num(r[16]),"去年发货":num(r[23]),"本年发货":num(r[20])});
      continue;
    }
    if(r[0])curSyb=r[0];
    if(r[1])curCh=r[1];
    if(r[2])curDq=mapRegionName(r[2]);
    if(r[3])curOc=r[3];
    var name=r[6]?String(r[6]).trim():"";
    if(!name||name==="小计")continue;
    name=mergeDealerName(name);
    if(isExcludedDealer(name))continue;
    rows.push({"事业部":curSyb||"","渠道":curCh||"","大区":curDq||"","运营中心":curOc||"","区域":"","编码":r[5]||"",
      "名称":name,"已发货":num(r[10]),"去年同期":num(r[16]),"去年发货":num(r[23]),"本年发货":num(r[20])});
  }
  return rows;
}

function mapRegionName(name){
  if(!name)return name;
  var s=String(name).trim();
  if(s==="东部战区")return"东区";
  if(s==="南部战区")return"南区";
  if(s==="西部战区")return"西区";
  if(s==="北部战区")return"北区";
  return s;
}

function parseSummarySheet(json,type){
  var rows=[],curSyb=null,curCh=null,curDq=null,curOc=null;
  var hasOps=(type==="运营中心");
  var C_SHIP=hasOps?7:6;
  var C_LYS=hasOps?13:12;
  var C_TY=hasOps?17:16;
  var C_LY=hasOps?20:19;
  for(var i=2;i<json.length;i++){
    var r=json[i];
    if(!r||r.every?r.every(function(v){return v==null||v===""}):true)continue;
    var isSub=false;
    for(var c=0;c<=3;c++){
      if(r[c]&&typeof r[c]==="string"&&(r[c]==="合计"||String(r[c]).indexOf("小计")>=0)){isSub=true;break}
    }
    if(r[0]&&r[0]!=="合计")curSyb=r[0];
    if(r[1]&&r[1]!=="小计"){curCh=r[1];curDq=null;curOc=null}
    if(r[2]!=null&&r[2]!=="")curDq=mapRegionName(r[2]);
    else if(!isSub)curDq=null;
    if(hasOps&&r[3]!=null&&r[3]!==""&&r[3]!=="小计")curOc=r[3];
    else if(hasOps&&!isSub)curOc=null;
    if(isSub){
      if(r[0]==="合计"){
        rows.push({"事业部":"","渠道":"","大区":"","运营中心":"","区域":"","编码":"","名称":"合计",
          "已发货":num(r[C_SHIP]),"去年同期":num(r[C_LYS]),"去年发货":num(r[C_LY]),"本年发货":num(r[C_TY])});
      }
      continue;
    }
    var rowName=hasOps?(curOc||""):(curDq||"");
    if(!rowName||rowName==="小计"||rowName==="-"||rowName==="/")continue;
    rows.push({"事业部":curSyb||"","渠道":curCh||"","大区":curDq||"","运营中心":hasOps?(curOc||""):"","区域":"","编码":"",
      "名称":rowName,"已发货":num(r[C_SHIP]),"去年同期":num(r[C_LYS]),"去年发货":num(r[C_LY]),"本年发货":num(r[C_TY])});
  }
  return rows;
}

function saveToCloud(payload,fileName,dataDate){
  fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rows:payload.region,rowsOps:payload.ops,rowsDealer:payload.dealer||[],fileName:fileName||"",dataDate:dataDate||"",region:"北区"})})
    .then(function(r){return r.json()})
    .then(function(d){if(d.ok)console.log("[Cloud] saved",d.count,"rows");else console.warn("[Cloud] save failed",d.msg)})
    .catch(function(e){console.warn("[Cloud] save error",e)})
}

    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok&&d.data&&d.data.rows&&d.data.rows.length>0){
        var allRows=d.data.rows;
        DATA_BY_REGION=allRows.filter(function(r){return r["大区"]===REGION_NAME||r["名称"]==="合计"});
        DATA_BY_OPS=(d.data.rowsOps||[]).filter(function(r){return r["大区"]===REGION_NAME||r["名称"]==="合计"});
        if(DATA_BY_OPS.length===0)DATA_BY_OPS=DATA_BY_REGION;
        var dealerRows=d.data.rowsDealer&&d.data.rowsDealer.length>0?d.data.rowsDealer:allRows;
        ALL_DATA=dealerRows.filter(function(r){return r["大区"]===REGION_NAME});
        ALL_REGIONS=["北区"];
        ALL_CHANNELS=sortedUniq(DATA_BY_REGION.map(function(r){return r["渠道"]}).filter(function(v){return v&&v!=="合计"}));
        ALL_OPS=sortedUniq(DATA_BY_OPS.map(function(r){return r["运营中心"]}).filter(function(v){return v&&v!=="合计"&&v!=="-"&&v!=="/"&&v!=="小计"}));
        DEALERS=sortedUniq(ALL_DATA.filter(function(r){return r["名称"]!=="合计"&&r["编码"]&&!isExcludedDealer(r["名称"])}).map(function(r){return r["名称"]}));
        if(d.data.uploadedAt){
          cloudUploadedAt=d.data.uploadedAt;
        }

          updateDataDate(d.data.dataDate);

      }else{
        showUploadStatus("info","\u2139\uFE0F 暂无云端数据，请上传Excel文件");
      }
    })
    .catch(function(e){
      console.warn("[Cloud] load error",e);
      showUploadStatus("info","\u2139\uFE0F 云端加载失败，请上传Excel文件");
    })
}

}
try{
  var saved=localStorage.getItem("theme");
  if(saved){applyTheme(saved)}
  else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches){applyTheme("dark")}
}catch(e){}

// ===== Auth =====
var AUTH_PASSWORD="2026";
function checkAuth(){
  var input=document.getElementById("authPassword").value;
  if(input===AUTH_PASSWORD){
    document.getElementById("authOverlay").style.display="none";
    document.getElementById("appMain").style.display="";
    try{localStorage.setItem("auth_ok","1")}catch(e){}
  }else{
    var err=document.getElementById("authError");
    err.textContent="密码错误，请重新输入";
    err.style.display="block";
    document.getElementById("authPassword").value="";
    document.getElementById("authPassword").focus();
  }
}
try{if(localStorage.getItem("auth_ok")==="1"){document.getElementById("authOverlay").style.display="none";document.getElementById("appMain").style.display=""}}catch(e){}
setTimeout(function(){var p=document.getElementById("authPassword");if(p)p.focus()},100);

</script>
</div><!-- /appMain -->
